<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Trip - GlobeTrot</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/booking.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header id="header"></header>

    <main>
        <!-- Page Header -->
        <section class="page-header" style="background-image: url('https://images.pexels.com/photos/2373201/pexels-photo-2373201.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2');">
            <div class="container">
                <h1>Book Your Trip</h1>
                <p>Complete your booking details to secure your dream vacation</p>
            </div>
        </section>

        <!-- Booking Process -->
        <section class="booking-process">
            <div class="container">
                <div class="booking-steps">
                    <div class="step active" data-step="1">
                        <div class="step-number">1</div>
                        <div class="step-label">Trip Details</div>
                    </div>
                    <div class="step" data-step="2">
                        <div class="step-number">2</div>
                        <div class="step-label">Accommodations</div>
                    </div>
                    <div class="step" data-step="3">
                        <div class="step-number">3</div>
                        <div class="step-label">Review & Pay</div>
                    </div>
                </div>

                <div class="booking-content">
                    <!-- Step 1: Trip Details -->
                    <div class="booking-step active" id="step-1">
                        <h2>Trip Details</h2>
                        <div class="booking-form">
                            <div class="destination-info" id="destination-info">
                                <!-- Destination info will be populated dynamically -->
                            </div>
                            <form id="trip-details-form">
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="check-in-date">Check-in Date</label>
                                        <input type="date" id="check-in-date" required>
                                    </div>
                                    <div class="form-group">
                                        <label for="check-out-date">Check-out Date</label>
                                        <input type="date" id="check-out-date" required>
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="adults">Adults</label>
                                        <select id="adults" required>
                                            <option value="1">1</option>
                                            <option value="2" selected>2</option>
                                            <option value="3">3</option>
                                            <option value="4">4</option>
                                            <option value="5">5+</option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label for="children">Children</label>
                                        <select id="children">
                                            <option value="0" selected>0</option>
                                            <option value="1">1</option>
                                            <option value="2">2</option>
                                            <option value="3">3</option>
                                            <option value="4">4+</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="special-requests">Special Requests</label>
                                    <textarea id="special-requests" rows="3" placeholder="Any special requirements or preferences?"></textarea>
                                </div>
                                <div class="form-actions">
                                    <button type="button" class="btn btn-primary" id="next-to-step-2">Continue to Accommodations</button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Step 2: Accommodations -->
                    <div class="booking-step" id="step-2">
                        <h2>Choose Your Accommodation</h2>
                        <div class="accommodations-list" id="accommodations-list">
                            <!-- Accommodations will be loaded dynamically -->
                        </div>
                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary" id="back-to-step-1">Back</button>
                            <button type="button" class="btn btn-primary" id="next-to-step-3">Continue to Review</button>
                        </div>
                    </div>

                    <!-- Step 3: Review & Pay -->
                    <div class="booking-step" id="step-3">
                        <h2>Review Your Booking</h2>
                        <div class="booking-summary" id="booking-summary">
                            <!-- Booking summary will be populated dynamically -->
                        </div>
                        <div class="payment-details">
                            <h3>Payment Details</h3>
                            <form id="payment-form">
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="card-name">Name on Card</label>
                                        <input type="text" id="card-name" required>
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="card-number">Card Number</label>
                                        <input type="text" id="card-number" placeholder="1234 5678 9012 3456" required>
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="expiry-date">Expiry Date</label>
                                        <input type="text" id="expiry-date" placeholder="MM/YY" required>
                                    </div>
                                    <div class="form-group">
                                        <label for="cvv">CVV</label>
                                        <input type="text" id="cvv" placeholder="123" required>
                                    </div>
                                </div>
                                <div class="form-actions">
                                    <button type="button" class="btn btn-secondary" id="back-to-step-2">Back</button>
                                    <button type="submit" class="btn btn-primary" id="complete-booking">Complete Booking</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer id="footer"></footer>

    <script src="js/app.js"></script>
    <script src="js/header-footer.js"></script>
    <script src="js/booking.js"></script>
    <script src="js/destinations.js"></script>
</body>
</html>
