<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - GlobeTrot</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/error.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header id="header"></header>

    <main>
        <section class="error-container">
            <div class="container">
                <div class="error-content">
                    <div class="error-image">
                        <i class="fas fa-map-marked-alt"></i>
                    </div>
                    <h1>404</h1>
                    <h2>Oops! You're Off The Map</h2>
                    <p>The page you're looking for seems to have wandered off on its own adventure.</p>
                    <div class="error-actions">
                        <a href="index.html" class="btn btn-primary">Back to Home</a>
                        <a href="destinations.html" class="btn btn-secondary">Explore Destinations</a>
                    </div>
                </div>
            </div>
        </section>

        <section class="suggested-destinations">
            <div class="container">
                <h2>Popular Destinations You Might Like</h2>
                <div class="suggestion-grid" id="suggestion-grid">
                    <!-- Will be populated dynamically -->
                </div>
            </div>
        </section>
    </main>

    <footer id="footer"></footer>

    <script src="js/app.js"></script>
    <script src="js/header-footer.js"></script>
    <script src="js/error.js"></script>
    <script src="js/destinations.js"></script>
</body>
</html>
